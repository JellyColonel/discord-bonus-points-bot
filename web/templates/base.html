<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Панель Бонусных Очков{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="{{ url_for('dashboard') }}" class="nav-brand-link">
                    <h1>💎 Панель Бонусных Очков</h1>
                </a>
            </div>
            {% if session.user %}
            <div class="nav-user">
                <span class="username">{{ session.user.username }}</span>
                <a href="{{ url_for('settings') }}" class="nav-icon-link" title="Настройки">⚙️</a>
                <a href="{{ url_for('logout') }}" class="btn btn-secondary">Выйти</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2025 Бонусные Очки. Сделано с ❤️ для вашего Discord сервера.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
